name: Build China Whitelist

on:
  schedule:
    # 18:35 UTC = 02:35 (UTC+8)
    # 比 LXC 里 04:00 的 cron 提前约 1.5 小时，给 GitHub 调度延迟和
    # raw.githubusercontent CDN 缓存（约 5 分钟）留出余量。
    # 分钟数刻意避开整点，整点是 GitHub 调度最堵的时候。
    - cron: "35 18 * * *"
  workflow_dispatch:

# 默认 GITHUB_TOKEN 是只读的，不给写权限 push 会 403
permissions:
  contents: write

concurrency:
  group: build-whitelist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # release.sh 内含健全性检查：数据源异常时 exit 1，
      # 仓库里的上一版产物原样保留，不会被残缺数据覆盖
      - name: Build whitelist
        run: bash release.sh

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- gfwlist2domain/whitelist_full.txt; then
            echo "规则无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfwlist2domain/whitelist_full.txt
          git commit -m "chore: 更新中国域名白名单（$(wc -l < gfwlist2domain/whitelist_full.txt) 个域名）"
          git push
